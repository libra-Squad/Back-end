spring.application.name=pair-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pair}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.config.import=optional:file:./.env[.properties]
app.jwt.secret-base64=${JWT_SECRET_BASE64}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{request_id}] %-5level %logger{36} - %msg%n
